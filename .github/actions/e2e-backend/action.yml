name: E2E backend
description: >
  Builds the backend and the workspace packages it runs against, starts it, waits until it
  answers, and seeds the catalog fixtures the browser journeys need. The calling job must provide
  the postgres and redis service containers and the POSTGRES_*, REDIS_URL, PORT, NODE_ENV and
  CORS_ALLOWED_ORIGINS variables, and must have installed dependencies. The backend log is
  written to $RUNNER_TEMP/backend.log; upload it as an artifact from the calling job.

runs:
  using: composite
  steps:
    - name: Generate the Prisma client
      shell: bash
      run: pnpm --filter @nova/backend run prisma:generate

    # DATABASE_URL, throwaway secrets, migrations.
    - uses: ./.github/actions/backend-test-env

    # `...` selects the backend and everything it depends on. The backend's compiled output
    # requires @nova/validation, which must be built for Node to be able to load it.
    - name: Build the backend and its workspace dependencies
      shell: bash
      run: pnpm --filter "@nova/backend..." build

    - name: Start the backend
      shell: bash
      working-directory: backend
      run: |
        nohup node dist/main.js > "$RUNNER_TEMP/backend.log" 2>&1 &
        pid=$!
        for _ in $(seq 1 90); do
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::The backend exited during start-up. Its log:"
            cat "$RUNNER_TEMP/backend.log"
            exit 1
          fi
          if curl -fsS -o /dev/null "http://localhost:${PORT}/v1/categories"; then
            echo "The backend is answering on port ${PORT} (node $(node -v))."
            exit 0
          fi
          sleep 1
        done
        echo "::error::The backend did not answer within 90 seconds. Its log:"
        cat "$RUNNER_TEMP/backend.log"
        exit 1

    - name: Seed the catalog fixtures
      shell: bash
      working-directory: backend
      run: node scripts/e2e-seed.mjs
