name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # The backend integration tests run against the real thing, not mocks, so this job
    # provides what they need. Same throwaway service containers as e2e.yml.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nova
          POSTGRES_PASSWORD: nova_dev_password
          POSTGRES_DB: nova
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nova -d nova"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Same ephemeral dev credentials as docker-compose.yml, kept as separate fields for
      # the reason given in .github/actions/backend-test-env/action.yml.
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: nova_dev_password
      POSTGRES_DB: nova
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the change since the base commit can be computed
          # (.github/scripts/select-scope.sh); a shallow clone would break it.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Without the generated client `prisma.*` is typed `any`, so type-aware backend lint
      # fails with hundreds of @typescript-eslint/no-unsafe-* errors (and typecheck cannot
      # see the models). Must run before lint, typecheck, test and build.
      - name: Generate Prisma client
        run: pnpm --filter @nova/backend run prisma:generate
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - run: pnpm secretlint
      - name: SAST (Semgrep) — backend/, per Vol 3 G1 ("every pull request")
        run: |
          python3 -m pip install semgrep
          # NOT --config=auto: current semgrep versions refuse to build an auto
          # config with metrics off ("Cannot create auto config when metrics are
          # off"), which made this step fail outright on every run. A named
          # public registry ruleset needs no metrics/telemetry round-trip.
          semgrep scan backend/src --config=p/security-audit --error --metrics=off
      # Decides what lint, typecheck, test and build cover, and reports it in the job
      # summary. Replaces `--filter=...[HEAD^1]`, which on a push looked only at the last
      # commit, so a last commit touching only CI files selected no packages at all and the
      # job reported green without checking anything.
      - name: Select affected packages
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: bash .github/scripts/select-scope.sh
      - name: Lint
        if: steps.scope.outputs.mode != 'none'
        run: pnpm exec turbo run lint ${{ steps.scope.outputs.args }}
      - run: pnpm format:check
      - name: Typecheck
        if: steps.scope.outputs.mode != 'none'
        run: pnpm exec turbo run typecheck ${{ steps.scope.outputs.args }}
      - name: Prepare backend test environment
        if: steps.scope.outputs.mode != 'none'
        uses: ./.github/actions/backend-test-env
      - name: Test
        if: steps.scope.outputs.mode != 'none'
        run: pnpm exec turbo run test ${{ steps.scope.outputs.args }}
      - name: Build
        if: steps.scope.outputs.mode != 'none'
        run: pnpm exec turbo run build ${{ steps.scope.outputs.args }}
