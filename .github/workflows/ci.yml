name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # The backend integration tests run against the real thing, not mocks, so this job
    # provides what they need. Same throwaway service containers as e2e.yml.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nova
          POSTGRES_PASSWORD: nova_dev_password
          POSTGRES_DB: nova
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nova -d nova"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Same ephemeral dev credentials as docker-compose.yml, kept as separate fields for
      # the reason given in .github/actions/backend-test-env/action.yml.
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: nova_dev_password
      POSTGRES_DB: nova
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so turbo can diff against HEAD^1 to scope tasks to
          # affected packages only; a shallow clone would break --filter=...[HEAD^1].
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Without the generated client `prisma.*` is typed `any`, so type-aware backend lint
      # fails with hundreds of @typescript-eslint/no-unsafe-* errors (and typecheck cannot
      # see the models). Must run before lint, typecheck, test and build.
      - name: Generate Prisma client
        run: pnpm --filter @nova/backend run prisma:generate
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - run: pnpm secretlint
      - name: SAST (Semgrep) — backend/, per Vol 3 G1 ("every pull request")
        run: |
          python3 -m pip install semgrep
          # NOT --config=auto: current semgrep versions refuse to build an auto
          # config with metrics off ("Cannot create auto config when metrics are
          # off"), which made this step fail outright on every run. A named
          # public registry ruleset needs no metrics/telemetry round-trip.
          semgrep scan backend/src --config=p/security-audit --error --metrics=off
      - run: pnpm exec turbo run lint --filter=...[HEAD^1]
      - run: pnpm format:check
      - run: pnpm exec turbo run typecheck --filter=...[HEAD^1]
      - name: Prepare backend test environment
        uses: ./.github/actions/backend-test-env
      - run: pnpm exec turbo run test --filter=...[HEAD^1]
      - run: pnpm exec turbo run build --filter=...[HEAD^1]
